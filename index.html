<style>
  :root {
    --bg: #eceef6;
    --card: #ffffff;
    --text: #12142b;
    --muted: #5f6480;
    --border: #d8dbec;
    --focus: #3b2bd9;
    --shadow: 0 1px 2px rgba(30, 30, 80, .06), 0 8px 24px rgba(30, 30, 80, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0f1f;
      --card: #171a30;
      --text: #f2f3fb;
      --muted: #9ba0bf;
      --border: #2a2e4d;
      --focus: #a99cff;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 20px 16px 40px;
  }
  main { width: 100%; max-width: 480px; }

  /* ---------- Cabecera ---------- */
  .profile { text-align: center; padding-top: 28px; }

  h1 {
    margin: 0 0 8px;
    font-size: clamp(2.1rem, 9vw, 2.7rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.05;
  }
  .bio {
    margin: 0 auto 28px;
    max-width: 34ch;
    color: var(--muted);
    font-size: 1.05rem;
    line-height: 1.45;
  }

  /* ---------- Links ---------- */
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  a.link {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    background: var(--card);
    color: var(--text);
    text-decoration: none;
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow);
    transition: transform .15s ease, border-color .15s ease;
  }
  a.link:hover { transform: translateY(-2px); border-color: var(--c); }
  a.link:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

  /* Iconos dibujados dentro de la página (SVG): no dependen de links externos. */
  .icon {
    flex: none;
    width: 48px; height: 48px;
    border-radius: 13px;
    background: var(--c);
    display: grid;
    place-items: center;
  }
  .icon svg { width: 28px; height: 28px; }

  .text { flex: 1; min-width: 0; }
  .name { display: block; font-weight: 700; font-size: 1.05rem; }
  .handle {
    display: block;
    margin-top: 2px;
    color: var(--muted);
    font-size: .88rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .chev { flex: none; width: 20px; height: 20px; color: var(--muted); }

  .youtube   { --c: #ff0000; }
  .tiktok    { --c: #000000; }
  .instagram { --c: #e1306c; }
  .instagram .icon { background: linear-gradient(45deg, #f9a03f, #e1306c, #833ab4); }
  .facebook  { --c: #1877f2; }
  .patreon   { --c: #ff424d; }

  footer {
    margin-top: 32px;
    text-align: center;
    color: var(--muted);
    font-size: .85rem;
  }

  @media (prefers-reduced-motion: reduce) {
    a.link { transition: none; }
    a.link:hover { transform: none; }
  }
</style>
</head>
